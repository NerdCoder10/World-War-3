<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World War 3 Theatre Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Saira+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=57">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1316">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>World War <b>3</b></h1><span>Theatre command · 196 nations</span></div>
  <nav class="modes" aria-label="Map layer">
    <button data-mode="campaign" aria-pressed="true">Campaign</button>
    <button data-mode="power" aria-pressed="false">Military</button>
    <button data-mode="hidden" aria-pressed="false">Secret assets</button>
    <button data-mode="gdp" aria-pressed="false">GDP</button>
    <button data-mode="soft" aria-pressed="false">Soft power</button>
    <button data-mode="value" aria-pressed="false">Value</button>
    <button data-mode="weather" aria-pressed="false">Weather</button>
  </nav>
  <div class="clockbox" title="Game clock: 1 game hour passes every 30 real seconds, so a day (one turn) is 12 minutes. Battles resolve at midnight.">
    <span class="clock" id="clock">Day 1 · 00:00</span>
    <button id="pause" class="pause" aria-label="Pause the clock" aria-pressed="false">⏸</button>
  </div>
  <button id="endturn" class="endturn" disabled title="Skip ahead to midnight: the day's battles resolve and a new day starts">Next day <small>D<span id="turnno">1</span></small></button>
  <div class="wallet">
    <span class="coins" title="Coins"><span class="coin" aria-hidden="true"></span><b id="coins">0</b></span>
    <button id="promo-btn" class="promo-btn">Promo code</button>
    <button id="reset-btn" class="reset-btn" title="Erase the saved campaign and start over">Reset</button>
    <button id="acct-btn" class="acct-btn">Sign in</button>
    <div id="acct" class="acct" hidden></div>
    <div id="promo" class="promo" hidden>
      <form id="promo-form">
        <label for="promo-code">Enter a promo code</label>
        <div class="promo-row"><input id="promo-code" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. WW3LAUNCH"><button type="submit">Redeem</button></div>
        <p id="promo-msg" class="promo-msg" role="status"></p>
      </form>
      <button id="promo-close" class="promo-close" aria-label="Close">×</button>
    </div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Find a country…" autocomplete="off" aria-label="Find a country">
    <ul id="search-results" hidden></ul>
  </div>
</header>
<main>
  <div class="mapwrap">
    <div class="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset zoom">⟲</button><button id="zstreet" aria-label="Street level" title="Jump to street level (or double-click the map anywhere)">🔍</button><button id="zterrain" aria-label="Satellite terrain" title="Satellite terrain on/off" aria-pressed="true">⛰</button><button id="zsats" aria-label="Satellites" title="Show satellites in orbit" aria-pressed="true">🛰</button><button id="zbases" aria-label="All bases" title="Show every country's bases" aria-pressed="true">⌖</button><button id="zstyle" aria-label="Map style" title="Map style">🗺</button></div>
    <div class="legend"></div>
    <div class="tooltip" hidden></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="dossier" aria-selected="true">Dossier</button>
      <button role="tab" data-tab="rankings" aria-selected="false">Rankings</button>
      <button role="tab" data-tab="alliances" aria-selected="false">Alliances</button>
      <button role="tab" data-tab="intel" aria-selected="false">Intel</button>
      <button role="tab" data-tab="campaign" aria-selected="false">Campaign</button>
    </div>
    <section class="pane" id="pane-dossier"></section>
    <section class="pane" id="pane-rankings" hidden></section>
    <section class="pane" id="pane-alliances" hidden></section>
    <section class="pane" id="pane-intel" hidden></section>
    <section class="pane" id="pane-campaign" hidden></section>
  </aside>
</main>
<div class="toast" hidden></div>

<script src="vendor/d3.min.js?v=57"></script>
<script src="vendor/topojson-client.min.js?v=57"></script>

</body>
</html>
